<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bubblegum Blow - Platformer</title>
    <style>
        html {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            text-align: center;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #000;
            width: min(800px, 96vw);
            max-height: 96dvh;
            overflow: hidden;
        }
        canvas {
            display: block;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: none;
            background: linear-gradient(to bottom, #4a90e2, #87ceeb);
        }
        .ui-panel {
            flex: none;
            background: #222;
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 4px 14px;
            font-size: clamp(13px, 3.8vw, 18px);
            font-weight: bold;
            border-top: 2px solid #444;
            white-space: nowrap;
        }
        .ui-panel .badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ui-panel img.badge-icon {
            height: 28px;
            width: auto;
            image-rendering: pixelated;
        }
        .coins {
            color: #ffd700;
        }
        .hearts {
            color: #ff5577;
        }
        .touch-controls {
            flex: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-top: 2px solid #444;
        }
        .touch-controls button {
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            color: #1a1a1a;
            padding: 16px 0;
            width: 64px;
            font-size: 22px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        .move-btn {
            background: linear-gradient(to bottom, #b3e5fc, #4fc3f7);
        }
        .move-btn:active {
            background: linear-gradient(to bottom, #81d4fa, #29b6f6);
        }
        .blow-btn {
            flex: 1;
            background: linear-gradient(to bottom, #ffcdd2, #ff8a80);
            font-size: 16px;
        }
        .blow-btn:active {
            background: linear-gradient(to bottom, #ff8a80, #ff5252);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="ui-panel">
        <div class="badge">
            <img class="badge-icon" src="assets/world_badge.png" alt="">
            Level: <span id="currentLevel">1</span>/3
        </div>
        <div class="coins">Coins: <span id="coinCount">0</span></div>
        <div class="hearts">Hearts: <span id="heartCount">♥♥♥</span></div>
    </div>
    <div class="touch-controls">
        <button class="move-btn" id="btnLeft" aria-label="Move left">◀</button>
        <button class="blow-btn" id="btnBlow" aria-label="Blow bubble">🫧 HOLD TO BLOW</button>
        <button class="move-btn" id="btnRight" aria-label="Move right">▶</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false; // keep the pixel art crisp when scaled

// Sprite assets (sliced from the star/gem sheet, the city tileset, and
// the bubblegum-blowing boy character sheet)
const sprites = {};
function loadSprite(name, src) {
    const img = new Image();
    img.src = src;
    sprites[name] = img;
}
loadSprite('coin', 'assets/star_blue.png');
loadSprite('goal', 'assets/star_gold.png');
loadSprite('bgCity', 'assets/bg_city.png');
loadSprite('platformTile', 'assets/platform_tile.png');
let platformPattern = null; // built once the tile image is loaded (see render)

// Player character frames. The art faces left by default; walking right
// is drawn mirrored. blow_1..blow_4 line up with player.bubbleStage.
loadSprite('walk_0', 'assets/player/walk_0.png');
loadSprite('walk_1', 'assets/player/walk_1.png');
loadSprite('walk_2', 'assets/player/walk_2.png');
loadSprite('walk_3', 'assets/player/walk_3.png');
loadSprite('idle_0', 'assets/player/idle_0.png');
loadSprite('idle_1', 'assets/player/idle_1.png');
loadSprite('idle_2', 'assets/player/idle_2.png');
loadSprite('fall_0', 'assets/player/fall_0.png');
loadSprite('blow_1', 'assets/player/blow_1.png');
loadSprite('blow_2', 'assets/player/blow_2.png');
loadSprite('blow_3', 'assets/player/blow_3.png');
loadSprite('blow_4', 'assets/player/blow_4.png');
loadSprite('blow_pop', 'assets/player/blow_pop.png');

const walkFrames = ['walk_0', 'walk_1', 'walk_2', 'walk_3'];
const idleFrames = ['idle_0', 'idle_1', 'idle_2'];
const blowFrames = [null, 'blow_1', 'blow_2', 'blow_3', 'blow_4']; // indexed by bubbleStage

// Balloon physics: one array, indexed by bubbleStage, is the single source
// of truth for both the sprite frame (blowFrames above) and the upward
// lift it produces (bubbleLift below) - stage N always means "blow_N on
// screen AND bubbleLift[N] of buoyancy" at the same instant, so the visual
// bubble size and the character's float speed can never drift apart.
const MAX_BUBBLE_STAGE = 4;
// Target speeds only - vy eases toward these (see updatePhysics) rather
// than snapping to them, and early stages barely lift at all so the
// character doesn't take off the instant the button is pressed. Real
// float only shows up once the bubble is nearly/fully inflated.
const bubbleLift = [0, -0.2, -0.5, -0.9, -1.5];
const BUBBLE_EASING = 0.06; // lower = softer, more gradual float
const INFLATE_TICK_MS = 250; // time to grow one stage while the button is held
const OVER_INFLATE_GRACE_TICKS = 1; // extra ticks allowed at max size before it bursts

// Game State
let currentLevel = 1;
let scoreCoins = 0;
let playerHearts = 3;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER, WIN

// Controls
const keys = { right: false, left: false, up: false, space: false };

window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
        if (!keys.space) triggerBubbleInflation();
        keys.space = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
        keys.space = false;
        popBubble();
    }
});

// On-screen touch controls (phones/tablets have no keyboard) - these
// drive the exact same `keys` flags and blow functions as the keyboard
// handlers above, so all the physics/animation logic only has to exist
// once. Pointer events cover touch, mouse, and stylus in one handler.
function bindHoldButton(el, onDown, onUp) {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
    el.addEventListener('pointerleave', onUp);
    el.addEventListener('pointercancel', onUp);
}

bindHoldButton(document.getElementById('btnLeft'),
    () => { keys.left = true; },
    () => { keys.left = false; });

bindHoldButton(document.getElementById('btnRight'),
    () => { keys.right = true; },
    () => { keys.right = false; });

bindHoldButton(document.getElementById('btnBlow'),
    () => { if (!keys.space) triggerBubbleInflation(); keys.space = true; },
    () => { keys.space = false; popBubble(); });

// Player Object
const GROUND_Y = 410; // top of the ground platform, kept in sync with loadLevel's ground rect
const player = {
    x: 50,
    y: GROUND_Y - 32, // feet resting on the ground - blow a bubble to leave it
    width: 32,
    height: 32,
    vx: 0,
    vy: 0,
    speed: 3,
    gravity: 0.5,
    isGrounded: false,
    bubbleStage: 0, // 0: None, 1-4: Progress
    isBlowing: false,
    facing: 'left', // matches the sprite sheet's default facing direction
    animFrame: 0,
    animTimer: 0,
    popFlashTimer: 0 // brief "blow_pop" frame shown right as a bubble pops
};

function triggerBubbleInflation() {
    if (player.isGrounded && player.bubbleStage === 0) {
        player.bubbleStage = 1;
        player.isBlowing = true;
        let overHoldTicks = 0;
        // Step-by-step automatic inflation while the button stays held.
        // `player.isBlowing` doubles as the "this blow session is still
        // active" flag, so a pop from any source (release, landing,
        // over-inflation) stops this loop instead of it fighting back.
        const inflationTimer = setInterval(() => {
            if (!keys.space || !player.isBlowing) {
                clearInterval(inflationTimer);
                return;
            }
            if (player.bubbleStage < MAX_BUBBLE_STAGE) {
                player.bubbleStage++;
            } else {
                // Already at max size - blowing harder over-inflates it
                overHoldTicks++;
                if (overHoldTicks > OVER_INFLATE_GRACE_TICKS) {
                    clearInterval(inflationTimer);
                    popBubble(); // over-inflation: it bursts on its own
                }
            }
        }, INFLATE_TICK_MS);
    }
}

function popBubble() {
    if (player.bubbleStage > 0) {
        player.bubbleStage = 0;
        player.isBlowing = false;
        player.popFlashTimer = 10; // frames to show the pop sprite
    }
}

// Level Data & Platforms
let platforms = [];
let coins = [];
let goalZone = {};

function loadLevel(levelNum) {
    currentLevel = levelNum;
    player.x = 50;
    player.y = GROUND_Y - player.height; // start standing on the ground, not mid-air
    player.vx = 0;
    player.vy = 0;
    player.isGrounded = true;
    player.bubbleStage = 0;
    player.popFlashTimer = 0;

    platforms = [
        { x: 0, y: 410, w: 800, h: 40, type: 'ground' } // Base ground / street level
    ];

    coins = [];

    if (levelNum === 1) {
        platforms.push(
            { x: 200, y: 320, w: 120, h: 20 },
            { x: 400, y: 240, w: 120, h: 20 },
            { x: 600, y: 160, w: 120, h: 20 }
        );
        // Coins above platform areas (3+ per cluster)
        coins.push(
            { x: 230, y: 280, collected: false }, { x: 250, y: 280, collected: false }, { x: 270, y: 280, collected: false },
            { x: 430, y: 200, collected: false }, { x: 450, y: 200, collected: false }, { x: 470, y: 200, collected: false },
            { x: 630, y: 120, collected: false }, { x: 650, y: 120, collected: false }, { x: 670, y: 120, collected: false }
        );
        goalZone = { x: 740, y: 100, w: 40, h: 60 };
    } else if (levelNum === 2) {
        platforms.push(
            { x: 150, y: 330, w: 100, h: 20 },
            { x: 320, y: 250, w: 100, h: 20 },
            { x: 500, y: 180, w: 100, h: 20 },
            { x: 650, y: 120, w: 100, h: 20 }
        );
        coins.push(
            { x: 175, y: 290, collected: false }, { x: 195, y: 290, collected: false }, { x: 215, y: 290, collected: false },
            { x: 345, y: 210, collected: false }, { x: 365, y: 210, collected: false }, { x: 385, y: 210, collected: false },
            { x: 525, y: 140, collected: false }, { x: 545, y: 140, collected: false }, { x: 565, y: 140, collected: false }
        );
        goalZone = { x: 700, y: 60, w: 40, h: 60 };
    } else if (levelNum === 3) {
        platforms.push(
            { x: 100, y: 340, w: 80, h: 20 },
            { x: 250, y: 270, w: 80, h: 20 },
            { x: 400, y: 200, w: 80, h: 20 },
            { x: 550, y: 140, w: 80, h: 20 },
            { x: 680, y: 90, w: 80, h: 20 }
        );
        coins.push(
            { x: 120, y: 300, collected: false }, { x: 140, y: 300, collected: false },
            { x: 270, y: 230, collected: false }, { x: 290, y: 230, collected: false },
            { x: 420, y: 160, collected: false }, { x: 440, y: 160, collected: false },
            { x: 570, y: 100, collected: false }, { x: 590, y: 100, collected: false }
        );
        goalZone = { x: 710, y: 30, w: 40, h: 60 };
    }
    document.getElementById('currentLevel').innerText = currentLevel;
}

function updatePhysics() {
    if (gameState !== 'PLAYING') return;

    // Horizontal Movement
    player.vx = 0;
    if (keys.right) player.vx = player.speed;
    if (keys.left) player.vx = -player.speed;
    player.x += player.vx;

    // Boundary check X
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // Facing & walk/idle animation (the sprite sheet faces left by default)
    if (player.vx > 0) player.facing = 'right';
    else if (player.vx < 0) player.facing = 'left';

    if (player.popFlashTimer > 0) player.popFlashTimer--;

    player.animTimer++;
    const animSpeed = player.vx !== 0 ? 8 : 18;
    if (player.animTimer >= animSpeed) {
        player.animTimer = 0;
        player.animFrame++;
    }

    // Vertical Physics (Balloon-style progressive lift vs Gravity).
    // bubbleLift[bubbleStage] is a target speed, not an instant one - the
    // same index that picks the on-screen sprite, so the ceiling on how
    // fast the character CAN rise always matches the bubble's drawn size.
    // vy eases toward that target each frame instead of snapping to it,
    // which is what actually reads as "floating" rather than "jumping":
    // a real balloon doesn't teleport to cruising speed the instant it
    // leaves the ground.
    if (player.bubbleStage > 0) {
        const targetVy = bubbleLift[player.bubbleStage];
        player.vy += (targetVy - player.vy) * BUBBLE_EASING;
    } else {
        // Bubble popped (or never blown) - gravity takes back over, and
        // the descent is a normal fall down to the ground/nearest
        // platform below, not an automatic penalty.
        player.vy += player.gravity;
    }

    player.y += player.vy;
    player.isGrounded = false;

    // Platform Collisions
    platforms.forEach(plat => {
        if (
            player.x < plat.x + plat.w &&
            player.x + player.width > plat.x &&
            player.y + player.height > plat.y &&
            player.y + player.height - player.vy <= plat.y
        ) {
            if (player.vy > 0) { // Landing on top
                player.y = plat.y - player.height;
                player.vy = 0;
                player.isGrounded = true;
                if (player.bubbleStage > 0) popBubble(); // Pop upon hitting ground safely
            }
        }
    });

    // Fall below screen limit safety check
    if (player.y > canvas.height) {
        loseLife();
    }

    // Coin Collection
    coins.forEach(coin => {
        if (!coin.collected &&
            player.x < coin.x + 12 && player.x + player.width > coin.x &&
            player.y < coin.y + 12 && player.y + player.height > coin.y) {
            coin.collected = true;
            scoreCoins += 10;
            document.getElementById('coinCount').innerText = scoreCoins;
        }
    });

    // Goal Check
    if (
        player.x < goalZone.x + goalZone.w &&
        player.x + player.width > goalZone.x &&
        player.y < goalZone.y + goalZone.h &&
        player.y + player.height > goalZone.y
    ) {
        if (currentLevel < 3) {
            loadLevel(currentLevel + 1);
        } else {
            gameState = 'WIN';
        }
    }
}

function loseLife() {
    playerHearts--;
    let heartsText = '';
    for (let i = 0; i < playerHearts; i++) heartsText += '♥';
    document.getElementById('heartCount').innerText = heartsText;

    if (playerHearts <= 0) {
        gameState = 'GAMEOVER';
    } else {
        // Reset position without penalty loss of level progress
        player.x = 50;
        player.y = GROUND_Y - player.height;
        player.vx = 0;
        player.vy = 0;
        player.isGrounded = true;
        player.bubbleStage = 0;
        player.popFlashTimer = 0;
    }
}

function drawPlayer() {
    // Pick the frame for the current state: popping > blowing > falling > walking > idle
    let key;
    if (player.popFlashTimer > 0) {
        key = 'blow_pop';
    } else if (player.bubbleStage > 0) {
        key = blowFrames[player.bubbleStage];
    } else if (!player.isGrounded) {
        key = 'fall_0';
    } else if (player.vx !== 0) {
        key = walkFrames[player.animFrame % walkFrames.length];
    } else {
        key = idleFrames[player.animFrame % idleFrames.length];
    }

    const img = sprites[key];
    if (!img || !img.complete || !img.naturalWidth) return;

    // Scale to a consistent on-screen height, anchored at the player's feet
    // and horizontally centered on the collision box.
    const targetHeight = 44;
    const scale = targetHeight / img.naturalHeight;
    const drawW = img.naturalWidth * scale;
    const drawH = targetHeight;
    const centerX = player.x + player.width / 2;
    const feetY = player.y + player.height;

    ctx.save();
    if (player.facing === 'right') {
        ctx.translate(centerX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, -drawW / 2, feetY - drawH, drawW, drawH);
    } else {
        ctx.drawImage(img, centerX - drawW / 2, feetY - drawH, drawW, drawH);
    }
    ctx.restore();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw the city skyline backdrop (houses, buildings & mountains
    // sliced from the tileset, composited into one background image).
    if (sprites.bgCity.complete && sprites.bgCity.naturalWidth) {
        ctx.drawImage(sprites.bgCity, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Build the platform texture pattern once the tile art has loaded
    if (!platformPattern && sprites.platformTile.complete && sprites.platformTile.naturalWidth) {
        platformPattern = ctx.createPattern(sprites.platformTile, 'repeat');
    }

    // Draw Platforms: frost-topped candy tile ledges over a grassy
    // street-level floor
    platforms.forEach(plat => {
        if (plat.type === 'ground') {
            const grad = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
            grad.addColorStop(0, '#2e7d32');
            grad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = grad;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#0d3d10';
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        } else if (platformPattern) {
            ctx.fillStyle = platformPattern;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#5b57a3';
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        } else {
            // Fallback while the tile image is still loading
            const grad = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
            grad.addColorStop(0, '#b0bec5');
            grad.addColorStop(1, '#78909c');
            ctx.fillStyle = grad;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#546e7a';
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        }
    });

    // Draw Goal (gold star marker)
    if (sprites.goal.complete && sprites.goal.naturalWidth) {
        ctx.drawImage(sprites.goal, goalZone.x - 8, goalZone.y - 8, goalZone.w + 16, goalZone.h + 16);
    } else {
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);
    }

    // Draw Coins (blue star sprites)
    coins.forEach(coin => {
        if (!coin.collected) {
            if (sprites.coin.complete && sprites.coin.naturalWidth) {
                ctx.drawImage(sprites.coin, coin.x - 6, coin.y - 6, 24, 24);
            } else {
                ctx.fillStyle = '#ffc107';
                ctx.beginPath();
                ctx.arc(coin.x + 6, coin.y + 6, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    });

    // Draw Player (bubblegum-blowing boy sprite sheet)
    drawPlayer();

    // Draw Overlays for Win / Game Over states
    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5252';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText('Refresh page to restart adventure', canvas.width / 2, canvas.height / 2 + 20);
    } else if (gameState === 'WIN') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#69f0ae';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText('All 3 levels completed successfully!', canvas.width / 2, canvas.height / 2 + 20);
    }
}

function gameLoop() {
    updatePhysics();
    render();
    requestAnimationFrame(gameLoop);
}

// Initialize Level 1 and Start Loop
loadLevel(1);
gameLoop();
</script>

</body>
</html>
