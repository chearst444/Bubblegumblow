<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bubblegum Blow - Platformer</title>
    <style>
        html {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            text-align: center;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #000;
            width: min(800px, 96vw);
            max-height: 96dvh;
            overflow: hidden;
        }
        canvas {
            display: block;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: none;
            background: linear-gradient(to bottom, #4a90e2, #87ceeb);
        }
        .ui-panel {
            flex: none;
            background: #222;
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 4px 14px;
            font-size: clamp(13px, 3.8vw, 18px);
            font-weight: bold;
            border-top: 2px solid #444;
            white-space: nowrap;
        }
        .ui-panel .badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ui-panel img.badge-icon {
            height: 28px;
            width: auto;
            image-rendering: pixelated;
        }
        .coins {
            color: #ffd700;
        }
        .health {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff5577;
        }
        .health-bar {
            width: 90px;
            height: 14px;
            border: 2px solid #7a1f2b;
            border-radius: 7px;
            background: #3a1015;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #ff5577, #ff8fa8);
            transition: width 0.2s ease-out;
        }
        .touch-controls {
            flex: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-top: 2px solid #444;
        }
        .touch-controls button {
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            color: #1a1a1a;
            padding: 16px 0;
            width: 64px;
            font-size: 22px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        .move-btn {
            background: linear-gradient(to bottom, #b3e5fc, #4fc3f7);
        }
        .move-btn:active {
            background: linear-gradient(to bottom, #81d4fa, #29b6f6);
        }
        .blow-btn {
            flex: 1;
            background: linear-gradient(to bottom, #ffcdd2, #ff8a80);
            font-size: 16px;
        }
        .blow-btn:active {
            background: linear-gradient(to bottom, #ff8a80, #ff5252);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="ui-panel">
        <div class="badge">
            <img class="badge-icon" src="assets/world_badge.png" alt="">
            Level: <span id="currentLevel">1</span>/3
        </div>
        <div class="coins">Coins: <span id="coinCount">0</span></div>
        <div class="health">
            Health
            <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
        </div>
    </div>
    <div class="touch-controls">
        <button class="move-btn" id="btnLeft" aria-label="Move left">◀</button>
        <button class="blow-btn" id="btnBlow" aria-label="Tap to blow, hold at full size">🫧 TAP TO BLOW</button>
        <button class="move-btn" id="btnRight" aria-label="Move right">▶</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false; // keep the pixel art crisp when scaled

// Sprite assets (sliced from the star/gem sheet, the city tileset, and
// the bubblegum-blowing boy character sheet)
const sprites = {};
function loadSprite(name, src) {
    const img = new Image();
    img.src = src;
    sprites[name] = img;
}
loadSprite('coin', 'assets/star_blue.png');
loadSprite('goal', 'assets/star_gold.png');
loadSprite('health', 'assets/health_up.png');
loadSprite('bgCity', 'assets/bg_city.png');
loadSprite('platformTile', 'assets/platform_tile.png');
let platformPattern = null; // built once the tile image is loaded (see render)

// Player character frames - real dedicated art for each facing direction,
// no mirroring. Confusingly, the no-suffix files are him facing RIGHT and
// the "_r" files face LEFT (the suffix names which upload they came from,
// not which way they face - see drawPlayer for the mapping). blow_1..
// blow_4 line up with player.bubbleStage for whichever direction is active.
loadSprite('walk_0', 'assets/player/walk_0.png');
loadSprite('walk_1', 'assets/player/walk_1.png');
loadSprite('walk_2', 'assets/player/walk_2.png');
loadSprite('walk_3', 'assets/player/walk_3.png');
loadSprite('idle_0', 'assets/player/idle_0.png');
loadSprite('idle_1', 'assets/player/idle_1.png');
loadSprite('idle_2', 'assets/player/idle_2.png');
loadSprite('fall_0', 'assets/player/fall_0.png');
loadSprite('blow_1', 'assets/player/blow_1.png');
loadSprite('blow_2', 'assets/player/blow_2.png');
loadSprite('blow_3', 'assets/player/blow_3.png');
loadSprite('blow_4', 'assets/player/blow_4.png');
loadSprite('blow_pop', 'assets/player/blow_pop.png');

loadSprite('walk_0_r', 'assets/player/walk_0_r.png');
loadSprite('walk_1_r', 'assets/player/walk_1_r.png');
loadSprite('walk_2_r', 'assets/player/walk_2_r.png');
loadSprite('walk_3_r', 'assets/player/walk_3_r.png');
loadSprite('idle_0_r', 'assets/player/idle_0_r.png');
loadSprite('idle_1_r', 'assets/player/idle_1_r.png');
loadSprite('idle_2_r', 'assets/player/idle_2_r.png');
loadSprite('fall_0_r', 'assets/player/fall_0_r.png');
loadSprite('blow_1_r', 'assets/player/blow_1_r.png');
loadSprite('blow_2_r', 'assets/player/blow_2_r.png');
loadSprite('blow_3_r', 'assets/player/blow_3_r.png');
loadSprite('blow_4_r', 'assets/player/blow_4_r.png');
// no right-facing pop frame exists - the brief pop flash reuses the left
// one for both directions, it's a one-instant burst effect either way

const walkFrames = ['walk_0', 'walk_1', 'walk_2', 'walk_3'];
const idleFrames = ['idle_0', 'idle_1', 'idle_2'];
const blowFrames = [null, 'blow_1', 'blow_2', 'blow_3', 'blow_4']; // indexed by bubbleStage
const walkFramesR = ['walk_0_r', 'walk_1_r', 'walk_2_r', 'walk_3_r'];
const idleFramesR = ['idle_0_r', 'idle_1_r', 'idle_2_r'];
const blowFramesR = [null, 'blow_1_r', 'blow_2_r', 'blow_3_r', 'blow_4_r'];

// Balloon physics. Inflate is tap counted.
// Tap 1: tiny bubble, start floating. Tap 2: a bit bigger.
// Tap 3: all the way. Tap 4: hold to steer. Let go to drop. Tap 5 pops.
const MAX_BUBBLE_STAGE = 4;
const BUBBLE_KICK = -1.4; // gentler lift on each grow tap
const HOVER_TARGET = [0, -0.10, -0.12, -0.14, -0.16];
const HOVER_EASING = 0.04;
const HEALTH_BOOST = 3; // about a third of the 10 point bar

// Fall damage: how far he drops (in px) from the highest point of an
// airborne excursion to where he lands decides the tier. Distance-based
// rather than tied to any specific platform, so it scales to whatever a
// level's tallest platform happens to be instead of being hardcoded to
// this game's current three levels.
const FALL_TRIVIAL = 20;   // below this, no damage - just a short hop
const FALL_SMALL = 90;     // -1 health
const FALL_MEDIUM = 190;   // -2 health; beyond this is treated as "highest platform" -3

// Game State
let currentLevel = 1;
let scoreCoins = 0;
const MAX_HEALTH = 10;
let playerHealth = MAX_HEALTH;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER, WIN

// Controls
const keys = { right: false, left: false, up: false, space: false };

window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
        e.preventDefault();
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
        if (!keys.space) tapPump(); // fire once per press, not per repeat-fired keydown
        keys.space = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
        keys.space = false;
        releaseHold();
    }
});

// On-screen touch controls (phones/tablets have no keyboard) - these
// drive the exact same movement flags and tapPump() as the keyboard
// handlers above, so all the physics/animation logic only has to exist
// once. Pointer events cover touch, mouse, and stylus in one handler.
function bindButton(el, onDown, onUp) {
    // Track each finger so hold (blow) and left/right can be down together.
    // Do not use pointerleave: a second finger on another button would
    // cancel the hold.
    let heldId = null;
    el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (heldId !== null) return;
        heldId = e.pointerId;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        onDown();
    });
    const end = (e) => {
        if (e.pointerId !== heldId) return;
        heldId = null;
        onUp();
    };
    el.addEventListener('pointerup', (e) => { e.preventDefault(); end(e); });
    el.addEventListener('pointercancel', end);
}

bindButton(document.getElementById('btnLeft'),
    () => { keys.left = true; },
    () => { keys.left = false; });

bindButton(document.getElementById('btnRight'),
    () => { keys.right = true; },
    () => { keys.right = false; });

bindButton(document.getElementById('btnBlow'),
    () => { tapPump(); },
    () => { releaseHold(); });

// Player Object
const GROUND_Y = 410; // top of the ground platform, kept in sync with loadLevel's ground rect
const player = {
    x: 50,
    y: GROUND_Y - 32, // feet resting on the ground - blow a bubble to leave it
    width: 32,
    height: 32,
    vx: 0,
    vy: 0,
    speed: 3,
    gravity: 0.5,
    isGrounded: false,
    bubbleStage: 0, // 0: None, 1-4: Progress - any stage > 0 floats continuously at that stage's rate
    hardPop: false,  // popped from over-inflation or a ceiling bump - next landing takes fall damage
    peakY: 0,        // highest point (min y) reached since he was last grounded
    facing: 'right', // starts facing into the level, toward the goal; updated from player.vx once he moves
    animFrame: 0,
    animTimer: 0,
    popFlashTimer: 0, // brief "blow_pop" frame shown right as a bubble pops
    leaking: false,   // hit the top of the screen, air leaking, slow drift down
    leakTimer: 0
};
player.peakY = player.y;

// Counted taps for this blow cycle. 0 idle, 1 tiny, 2 bigger, 3 all the way,
// 4 hold to steer, 5 popped.
let pumpCount = 0;

function tapPump() {
    if (gameState !== 'PLAYING') return;

    // Fifth tap pops, even in the air after a drop from tap 4.
    if (pumpCount >= 4) {
        pumpCount = 5;
        burstBubble();
        return;
    }

    // A new cycle can only begin on the ground.
    if (pumpCount === 0 && !player.isGrounded) return;

    pumpCount++;

    if (pumpCount === 1) {
        // Tiny bubble. Start floating the moment you see it.
        player.bubbleStage = 1;
        player.vy = BUBBLE_KICK;
        return;
    }

    if (pumpCount === 2) {
        // A little bit bigger. Keep floating after release.
        player.bubbleStage = 2;
        player.vy = BUBBLE_KICK;
        return;
    }

    if (pumpCount === 3) {
        // All the way blown up. Still floating without holding.
        player.bubbleStage = 4;
        player.vy = BUBBLE_KICK;
        return;
    }

    if (pumpCount === 4) {
        // Hold this press to steer at full size.
        player.bubbleStage = 4;
        player.vy = BUBBLE_KICK;
    }
}

function releaseHold() {
    // Taps 1 to 3: letting go does not drop. He keeps floating.
    if (pumpCount < 4) return;
    // Tap 4: let go of the hold to drop down. Not a pop.
    if (pumpCount === 4 && player.bubbleStage > 0) {
        dropFromHold();
    }
}

function dropFromHold() {
    player.bubbleStage = 0;
    player.hardPop = true;
    player.leaking = false;
    player.leakTimer = 0;
}

function burstBubble() {
    // Popped from a fifth tap or from bonking a platform from below.
    player.bubbleStage = 0;
    player.hardPop = true;
    player.popFlashTimer = 10;
    player.leaking = false;
    player.leakTimer = 0;
}

function softLand() {
    // Landed on a platform while a bubble was still up. Deflate and
    // start a new tap cycle from the ground.
    player.bubbleStage = 0;
    pumpCount = 0;
    player.leaking = false;
    player.leakTimer = 0;
}

function applyFallDamage(distance) {
    let dmg = 0;
    if (distance >= FALL_MEDIUM) dmg = 3;       // from the highest platform
    else if (distance >= FALL_SMALL) dmg = 2;   // a bigger fall
    else if (distance >= FALL_TRIVIAL) dmg = 1; // a little fall
    if (dmg === 0) return;

    playerHealth = Math.max(0, playerHealth - dmg);
    document.getElementById('healthFill').style.width = (playerHealth / MAX_HEALTH * 100) + '%';
    if (playerHealth <= 0) gameState = 'GAMEOVER';
}

// Level Data & Platforms
let platforms = [];
let coins = [];
let healthPickups = [];
let goalZone = {};

function loadLevel(levelNum) {
    currentLevel = levelNum;
    pumpCount = 0;
    player.x = 50;
    player.y = GROUND_Y - player.height; // start standing on the ground, not mid-air
    player.vx = 0;
    player.vy = 0;
    player.isGrounded = true;
    player.facing = 'right'; // face into the new level
    player.bubbleStage = 0;
    player.hardPop = false;
    player.peakY = player.y;
    player.popFlashTimer = 0;
    player.leaking = false;
    player.leakTimer = 0;

    platforms = [
        { x: 0, y: 410, w: 800, h: 40, type: 'ground' } // Base ground / street level
    ];

    coins = [];
    healthPickups = [];

    if (levelNum === 1) {
        platforms.push(
            { x: 200, y: 320, w: 120, h: 20 },
            { x: 400, y: 240, w: 120, h: 20 },
            { x: 600, y: 160, w: 120, h: 20 }
        );
        // Coins above platform areas (3+ per cluster)
        coins.push(
            { x: 230, y: 280, collected: false }, { x: 250, y: 280, collected: false }, { x: 270, y: 280, collected: false },
            { x: 430, y: 200, collected: false }, { x: 450, y: 200, collected: false }, { x: 470, y: 200, collected: false },
            { x: 630, y: 120, collected: false }, { x: 650, y: 120, collected: false }, { x: 670, y: 120, collected: false }
        );
        // Little health up on the last bar, about a third of the bar
        healthPickups.push({ x: 695, y: 128, collected: false });
        goalZone = { x: 740, y: 100, w: 40, h: 60 };
    } else if (levelNum === 2) {
        platforms.push(
            { x: 150, y: 330, w: 100, h: 20 },
            { x: 320, y: 250, w: 100, h: 20 },
            { x: 500, y: 180, w: 100, h: 20 },
            { x: 650, y: 120, w: 100, h: 20 }
        );
        coins.push(
            { x: 175, y: 290, collected: false }, { x: 195, y: 290, collected: false }, { x: 215, y: 290, collected: false },
            { x: 345, y: 210, collected: false }, { x: 365, y: 210, collected: false }, { x: 385, y: 210, collected: false },
            { x: 525, y: 140, collected: false }, { x: 545, y: 140, collected: false }, { x: 565, y: 140, collected: false }
        );
        goalZone = { x: 700, y: 60, w: 40, h: 60 };
    } else if (levelNum === 3) {
        platforms.push(
            { x: 100, y: 340, w: 80, h: 20 },
            { x: 250, y: 270, w: 80, h: 20 },
            { x: 400, y: 200, w: 80, h: 20 },
            { x: 550, y: 140, w: 80, h: 20 },
            { x: 680, y: 90, w: 80, h: 20 }
        );
        coins.push(
            { x: 120, y: 300, collected: false }, { x: 140, y: 300, collected: false },
            { x: 270, y: 230, collected: false }, { x: 290, y: 230, collected: false },
            { x: 420, y: 160, collected: false }, { x: 440, y: 160, collected: false },
            { x: 570, y: 100, collected: false }, { x: 590, y: 100, collected: false }
        );
        goalZone = { x: 710, y: 30, w: 40, h: 60 };
    }
    document.getElementById('currentLevel').innerText = currentLevel;
}

function updatePhysics() {
    if (gameState !== 'PLAYING') return;

    // Horizontal Movement
    player.vx = 0;
    if (keys.right) player.vx = player.speed;
    if (keys.left) player.vx = -player.speed;
    player.x += player.vx;

    // Boundary check X
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // Facing & walk/idle animation (the sprite sheet faces left by default)
    if (player.vx > 0) player.facing = 'right';
    else if (player.vx < 0) player.facing = 'left';

    if (player.popFlashTimer > 0) player.popFlashTimer--;

    player.animTimer++;
    const animSpeed = player.vx !== 0 ? 8 : 18;
    if (player.animTimer >= animSpeed) {
        player.animTimer = 0;
        player.animFrame++;
    }

    // Vertical physics: hover while a bubble is up. Taps 1 to 3 keep
    // floating after release. Tap 4 only while the blow button is held.
    // Hold (space / TAP TO BLOW) and left/right work at the same time.
    if (player.leaking && player.bubbleStage > 0) {
        // Hit the top: leak air and drift down slowly. Not a pop.
        player.vy += (0.28 - player.vy) * 0.06;
        player.leakTimer++;
        if (player.leakTimer >= 50) {
            player.leakTimer = 0;
            if (player.bubbleStage === 4) player.bubbleStage = 2;
            else if (player.bubbleStage === 2) player.bubbleStage = 1;
            else {
                player.bubbleStage = 0;
                player.leaking = false;
            }
        }
    } else if (player.bubbleStage > 0) {
        player.vy += (HOVER_TARGET[player.bubbleStage] - player.vy) * HOVER_EASING;
    } else {
        player.vy += player.gravity;
    }

    const wasGrounded = player.isGrounded;
    player.y += player.vy;
    player.isGrounded = false;

    // Top of the screen: start a slow deflate, do not pop.
    if (player.y < 6) {
        player.y = 6;
        if (player.vy < 0) player.vy = 0;
        if (player.bubbleStage > 0 && !player.leaking) {
            player.leaking = true;
            player.leakTimer = 0;
        }
    }

    // Track the highest point (lowest y) reached since he was last
    // grounded, so a landing can tell how big a fall it was.
    player.peakY = Math.min(player.peakY, player.y);

    // Platform Collisions
    platforms.forEach(plat => {
        const horizontalOverlap = player.x < plat.x + plat.w && player.x + player.width > plat.x;
        if (!horizontalOverlap) return;

        if (
            player.vy >= 0 &&
            player.y + player.height >= plat.y &&
            player.y <= plat.y + plat.h
        ) {
            // Resting on (or landing on) top of this platform. >= rather
            // than a strict "crossed this frame" check, so a bubble
            // hovering with exactly zero lift (stage 1, before floating
            // actually starts) still reads as grounded every frame
            // instead of only on the one frame it first touched down.
            player.y = plat.y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        } else if (
            player.vy < 0 &&
            player.y < plat.y + plat.h &&
            player.y - player.vy >= plat.y + plat.h
        ) {
            // Bonked the underside of a platform while floating up - the
            // bubble can't push through it, so it bursts and he drops.
            player.y = plat.y + plat.h;
            player.vy = 0;
            if (player.bubbleStage > 0) burstBubble();
        }
    });

    if (player.isGrounded && !wasGrounded) {
        // Just touched down this frame - run landing side effects once,
        // not on every subsequent frame spent simply resting there.
        const fallDistance = player.y - player.peakY;
        if (player.hardPop) {
            applyFallDamage(fallDistance);
            player.hardPop = false;
        }
        if (player.bubbleStage > 0) softLand();
        pumpCount = 0;
    }
    if (player.isGrounded) player.peakY = player.y;

    // Fall below screen limit safety check
    if (player.y > canvas.height) {
        loseLife();
    }

    // Coin Collection
    coins.forEach(coin => {
        if (!coin.collected &&
            player.x < coin.x + 12 && player.x + player.width > coin.x &&
            player.y < coin.y + 12 && player.y + player.height > coin.y) {
            coin.collected = true;
            scoreCoins += 10;
            document.getElementById('coinCount').innerText = scoreCoins;
        }
    });

    healthPickups.forEach(item => {
        if (!item.collected &&
            player.x < item.x + 16 && player.x + player.width > item.x &&
            player.y < item.y + 16 && player.y + player.height > item.y) {
            item.collected = true;
            playerHealth = Math.min(MAX_HEALTH, playerHealth + HEALTH_BOOST);
            document.getElementById('healthFill').style.width = (playerHealth / MAX_HEALTH * 100) + '%';
        }
    });

    // Goal Check
    if (
        player.x < goalZone.x + goalZone.w &&
        player.x + player.width > goalZone.x &&
        player.y < goalZone.y + goalZone.h &&
        player.y + player.height > goalZone.y
    ) {
        if (currentLevel < 3) {
            loadLevel(currentLevel + 1);
        } else {
            gameState = 'WIN';
        }
    }
}

function loseLife() {
    // Missing every platform and hitting the bottom of the screen - the
    // one fall with no landing to measure, so it costs the worst tier
    // outright rather than going through applyFallDamage().
    playerHealth = Math.max(0, playerHealth - 3);
    document.getElementById('healthFill').style.width = (playerHealth / MAX_HEALTH * 100) + '%';

    if (playerHealth <= 0) {
        gameState = 'GAMEOVER';
    } else {
        // Reset position without penalty loss of level progress
        pumpCount = 0;
        player.x = 50;
        player.y = GROUND_Y - player.height;
        player.vx = 0;
        player.vy = 0;
        player.isGrounded = true;
        player.facing = 'right';
        player.bubbleStage = 0;
        player.hardPop = false;
        player.peakY = player.y;
        player.popFlashTimer = 0;
        player.leaking = false;
        player.leakTimer = 0;
    }
}

function drawPlayer() {
    // Facing <-> sheet mapping - flipped back per explicit feedback that
    // the previous version had it backwards in both directions.
    const right = player.facing === 'right';
    const walk = right ? walkFrames : walkFramesR;
    const idle = right ? idleFrames : idleFramesR;
    const blow = right ? blowFrames : blowFramesR;
    const fall = right ? 'fall_0' : 'fall_0_r';

    // Pick the frame for the current state: popping > blowing > falling > walking > idle
    let key;
    if (player.popFlashTimer > 0) {
        key = 'blow_pop'; // only drawn one way - see the loadSprite note above
    } else if (player.bubbleStage > 0) {
        key = blow[player.bubbleStage];
    } else if (!player.isGrounded) {
        key = fall;
    } else if (player.vx !== 0) {
        key = walk[player.animFrame % walk.length];
    } else {
        key = idle[player.animFrame % idle.length];
    }

    const img = sprites[key];
    if (!img || !img.complete || !img.naturalWidth) return;

    // Scale to a consistent on-screen height, anchored at the player's feet
    // and horizontally centered on the collision box.
    const targetHeight = 44;
    const scale = targetHeight / img.naturalHeight;
    const drawW = img.naturalWidth * scale;
    const drawH = targetHeight;
    const centerX = player.x + player.width / 2;
    const feetY = player.y + player.height;

    ctx.drawImage(img, centerX - drawW / 2, feetY - drawH, drawW, drawH);
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw the city skyline backdrop (houses, buildings & mountains
    // sliced from the tileset, composited into one background image).
    if (sprites.bgCity.complete && sprites.bgCity.naturalWidth) {
        ctx.drawImage(sprites.bgCity, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Build the platform texture pattern once the tile art has loaded
    if (!platformPattern && sprites.platformTile.complete && sprites.platformTile.naturalWidth) {
        platformPattern = ctx.createPattern(sprites.platformTile, 'repeat');
    }

    // Draw Platforms: frost-topped candy tile ledges over a grassy
    // street-level floor
    platforms.forEach(plat => {
        if (plat.type === 'ground') {
            const grad = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
            grad.addColorStop(0, '#2e7d32');
            grad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = grad;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#0d3d10';
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        } else if (platformPattern) {
            ctx.fillStyle = platformPattern;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#5b57a3';
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        } else {
            // Fallback while the tile image is still loading
            const grad = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
            grad.addColorStop(0, '#b0bec5');
            grad.addColorStop(1, '#78909c');
            ctx.fillStyle = grad;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#546e7a';
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        }
    });

    // Draw Goal (gold star marker)
    if (sprites.goal.complete && sprites.goal.naturalWidth) {
        ctx.drawImage(sprites.goal, goalZone.x - 8, goalZone.y - 8, goalZone.w + 16, goalZone.h + 16);
    } else {
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);
    }

    // Draw Coins (blue star sprites)
    coins.forEach(coin => {
        if (!coin.collected) {
            if (sprites.coin.complete && sprites.coin.naturalWidth) {
                ctx.drawImage(sprites.coin, coin.x - 6, coin.y - 6, 24, 24);
            } else {
                ctx.fillStyle = '#ffc107';
                ctx.beginPath();
                ctx.arc(coin.x + 6, coin.y + 6, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    });

    healthPickups.forEach(item => {
        if (!item.collected) {
            if (sprites.health && sprites.health.complete && sprites.health.naturalWidth) {
                ctx.drawImage(sprites.health, item.x - 4, item.y - 4, 24, 24);
            } else {
                ctx.fillStyle = '#ff8fa8';
                ctx.beginPath();
                ctx.moveTo(item.x + 8, item.y + 4);
                ctx.bezierCurveTo(item.x + 8, item.y, item.x, item.y, item.x, item.y + 6);
                ctx.bezierCurveTo(item.x, item.y + 12, item.x + 8, item.y + 16, item.x + 8, item.y + 16);
                ctx.bezierCurveTo(item.x + 8, item.y + 16, item.x + 16, item.y + 12, item.x + 16, item.y + 6);
                ctx.bezierCurveTo(item.x + 16, item.y, item.x + 8, item.y, item.x + 8, item.y + 4);
                ctx.fill();
            }
        }
    });

    // Draw Player (bubblegum-blowing boy sprite sheet)
    drawPlayer();

    // Draw Overlays for Win / Game Over states
    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5252';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText('Refresh page to restart adventure', canvas.width / 2, canvas.height / 2 + 20);
    } else if (gameState === 'WIN') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#69f0ae';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText('All 3 levels completed successfully!', canvas.width / 2, canvas.height / 2 + 20);
    }
}

function gameLoop() {
    updatePhysics();
    render();
    requestAnimationFrame(gameLoop);
}

// Initialize Level 1 and Start Loop
loadLevel(1);
gameLoop();
</script>
